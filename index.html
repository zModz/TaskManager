<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body data-bs-theme="dark">
    <div class="container mt-5">
      <h1>Task Manager</h1>
      <p>Manage your tasks efficiently.</p>
    </div>
    <div class="container mt-3 mb-5 p-3 border rounded">
      <button data-bs-toggle="modal" data-bs-target="#addModal" class="btn btn-primary">Add New Task</button>
      <table id="taskList" class="table table-striped mt-3 rounded">
        <tr>
          <th></th>
          <th>Name</th>
          <th>Hours</th>
          <th>Description</th>
          <th></th>
        </tr>
      </table>
  
      <div>
        <label for="resetTime" class="form-label">Reset at </label>
        <input type="time" id="resetTime" value="00:00" class="form-control" />
      </div>
      <div class="mt-3">
        <button onclick="resetTasks()" class="btn btn-secondary">Reset</button>
        <button id="notifyButton" class="btn btn-info">Enable Notifications</button>
      </div>
    </div>
    <!-- Modal -->
    <div
      class="modal fade"
      id="addModal"
      tabindex="-1"
      aria-labelledby="addModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="addModalLabel">Add Task</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="taskName" class="form-label">Task Name</label>
              <input type="text" class="form-control" id="taskName" />
            </div>
            <div class="mb-3">
              <label for="taskHours" class="form-label">Hours</label>
              <input type="time" class="form-control" id="taskHours" />
            </div>
            <div class="mb-3">
              <label for="taskDescription" class="form-label">Description</label>
              <textarea class="form-control" id="taskDescription"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" onclick="addTask()" class="btn btn-primary">Add Task</button>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="main.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</html>
